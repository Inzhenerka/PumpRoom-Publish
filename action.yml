name: PumpRoom Publish
description: GitHub Action to upload tasks to PumpRoom LMS
author: Inzhenerka.Tech

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: upload-cloud
  color: purple

# Define your inputs here.
inputs:
  source_ref:
    description: "Stable source identifier; defaults to the URL of the workflow repository.
      Sent verbatim when provided; set for another checkout."
    required: false
    default: ""
  root_dir:
    description: "Directory to be archived and uploaded"
    required: false
    default: ""
  ignore:
    description: "Files and directories to ignore (comma-separated)"
    required: false
    default: ""
  realm:
    description: "Realm identifier for the repository"
    required: true
  repo_name:
    description: "Repository name"
    required: true
  api_key:
    description: "API key for authentication"
    required: true

outputs:
  status:
    description: "Publication outcome: success, warning (skipped tasks), or failure"
  failed_stage:
    description: "Stage that failed; empty on confirmed publication"
  result:
    description: "Confirmed API publication result as JSON; absent on failure"
  tasks_uploaded:
    description: "Tasks in the uploaded snapshot, including unchanged and skipped tasks"
  tasks_created:
    description: "Tasks created"
  tasks_updated:
    description: "Tasks updated"
  tasks_archived:
    description: "Missing source-managed tasks archived"
  tasks_unchanged:
    description: "Tasks unchanged"
  tasks_skipped:
    description: "Tasks skipped; names and reasons are in result and the summary"

runs:
  using: node24
  main: dist/index.cjs
